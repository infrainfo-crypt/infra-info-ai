name: Infra Info AI

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python
        run: python main.py

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: msrc-security-update
          path: msrc_2026-09.csv
